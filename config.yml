baseURL: "https://tadtd.github.io/"
title: "TADTD Blog"
copyright: "© TADTD"
theme: ["hugo-PaperMod"]
defaultContentLanguage: en
defaultContentLanguageInSubdir: false

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts"]

taxonomies:
  category: categories
  tag: tags
  series: series

languages:
  en:
    languageName: English
    label: English
    weight: 1
    params:
      homeInfoParams:
        Title: "Hello, I am TADTD 👋"
        Content: |
          This is where I write about what I learn, the projects I work on, and useful notes.

          Read the latest posts below or visit the [Archive](/archives/) to browse the blog.
    menu:
      main:
        - name: About
          url: about/
          weight: 1
        - name: Archive
          url: archives/
          weight: 2
        - name: Search
          url: search/
          weight: 3
        - name: Tags
          url: tags/
          weight: 4
  vi:
    languageName: Tiếng Việt
    label: Tiếng Việt
    weight: 2
    title: "TADTD Blog"
    params:
      homeInfoParams:
        Title: "Xin chào, mình là TADTD 👋"
        Content: |
          Đây là nơi mình ghi lại những điều đã học, những dự án đang làm và các ghi chú hữu ích.

          Xem các bài viết mới nhất bên dưới hoặc ghé [Lưu trữ](/vi/archives/) để xem toàn bộ blog.
    menu:
      main:
        - name: Giới thiệu
          url: about/
          weight: 1
        - name: Lưu trữ
          url: archives/
          weight: 2
        - name: Tìm kiếm
          url: search/
          weight: 3
        - name: Thẻ
          url: tags/
          weight: 4

pagination:
  pagerSize: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  description: "Blog cá nhân của TADTD."
  author: TADTD
  defaultTheme: auto
  ShowShareButtons: true
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  displayFullLangName: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

services:
  instagram:
    disableInlineCSS: true
  x:
    disableInlineCSS: true
